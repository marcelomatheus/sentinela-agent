[project]
name = "sentinela"
version = "0.1.0"
description = "Sistema especialista híbrido para triagem de fraudes digitais via WhatsApp"
requires-python = ">=3.15,<3.16"
dependencies = [
  "agno==3.2.1", "openai>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "python-dotenv>=1,<2", "pydantic>=2.11,<3", "pydantic-settings>=2.9,<3", "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pillow>=11,<14"
]
[tool.poetry]
packages = [{include = "sentinela", from = "src"}]
[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.11,<1"
mypy = ">=1.15,<3"
[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
strict = true
mypy_path = "src"
[[tool.mypy.overrides]]
module = ["agno.*"]
ignore_missing_imports = true
