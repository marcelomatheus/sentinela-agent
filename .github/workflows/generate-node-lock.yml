name: One-time Node lock generation

on:
  push:
    branches: [feat/multichannel-web-bff-react]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Generate pinned dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(web): lock npm workspace dependencies"
            git push origin HEAD:feat/multichannel-web-bff-react
          fi
