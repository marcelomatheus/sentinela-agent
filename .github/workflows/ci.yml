name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sentinela
          POSTGRES_DB: sentinela
          POSTGRES_PASSWORD: disposable-ci-password-123456789
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinela"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUN_POSTGRES_TESTS: '1'
      POSTGRES_PASSWORD: disposable-ci-password-123456789
      WEBHOOK_API_KEY: disposable-ci-webhook-key-123456789
      EVOLUTION_API_URL: https://example.invalid
      EVOLUTION_API_KEY: test-only
      EVOLUTION_INSTANCE: sentinela
      OPENAI_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - run: python -m pip install poetry==2.2.1
      - run: poetry install --no-interaction
      - run: poetry run python -m compileall -q src
      - run: poetry run pytest -q
      - run: poetry run ruff check src tests scripts --select E4,E7,E9,F
      - run: poetry run mypy src/sentinela/domain src/sentinela/application
      - run: poetry run python -c 'from sentinela.config import get_settings; from sentinela.infrastructure.ai import AgnoSpecialist; from sentinela.interfaces.worker import main; AgnoSpecialist(get_settings())'
      - run: docker build --pull --tag sentinela:ci .
