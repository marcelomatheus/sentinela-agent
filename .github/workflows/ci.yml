name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sentinela
          POSTGRES_DB: sentinela
          POSTGRES_PASSWORD: disposable-ci-password-123456789
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinela"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUN_POSTGRES_TESTS: '1'
      POSTGRES_PASSWORD: disposable-ci-password-123456789
      WEBHOOK_API_KEY: disposable-ci-webhook-key-123456789
      EVOLUTION_API_URL: https://example.invalid
      EVOLUTION_API_KEY: test-only
      EVOLUTION_INSTANCE: sentinela
      OPENAI_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - run: python -m pip install poetry==2.2.1
      - run: poetry check --lock
      - run: poetry install --no-interaction
      - run: poetry run python -m compileall -q src
      - run: poetry run pytest -q
      - run: poetry run ruff check src tests scripts --select E4,E7,E9,F
      - run: poetry run mypy src/sentinela/domain src/sentinela/application
      - run: poetry run python -c 'from sentinela.config import get_settings; from sentinela.infrastructure.ai import AgnoSpecialist; from sentinela.interfaces.worker import main; AgnoSpecialist(get_settings())'
      - name: Verify private Docker network topology
        run: |
          cp .env.example .env
          docker compose config --format json > /tmp/sentinela-compose.json
          python - <<'PY'
          import json
          with open("/tmp/sentinela-compose.json", encoding="utf-8") as stream:
              compose = json.load(stream)
          services = compose["services"]
          assert "whatsapp_internal" in services["api"]["networks"]
          assert "whatsapp_internal" in services["worker"]["networks"]
          assert "whatsapp_internal" not in services["db"]["networks"]
          aliases = services["api"]["networks"]["whatsapp_internal"]["aliases"]
          assert "sentinela-api" in aliases
          binding = services["api"]["ports"]
          assert all(port["host_ip"] == "127.0.0.1" for port in binding)
          assert compose["networks"]["whatsapp_internal"]["external"] is True
          PY
      - run: docker build --pull --tag sentinela:ci .
      - name: Smoke test web migration in real Python containers
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=disposable-ci-password-123456789/' \
            -e 's/^WEBHOOK_API_KEY=.*/WEBHOOK_API_KEY=disposable-ci-webhook-key-123456789/' \
            -e 's/^EVOLUTION_API_KEY=.*/EVOLUTION_API_KEY=test-only/' \
            -e 's/^OPENAI_API_KEY=.*/OPENAI_API_KEY=test-only/' \
            -e 's/^WEB_INTERNAL_KEY=.*/WEB_INTERNAL_KEY=internal-disposable-signature-key-123456789/' \
            .env
          docker network create whatsapp_internal
          trap 'docker compose --profile web down -v --remove-orphans; docker network rm whatsapp_internal' EXIT
          docker compose --profile web up -d --build db api web_worker
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/health/ready; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health/ready
          docker compose --profile web exec -T web_worker python -c \
            "from sentinela.config import get_settings; from sentinela.infrastructure.web_store import WebStore; s=WebStore(get_settings()); c=s.connect(); db=c.__enter__(); assert db.execute('SELECT count(*) AS n FROM app.web_request_nonces').fetchone()['n']==0; assert db.execute('SELECT count(*) AS n FROM app.web_jobs').fetchone()['n']==0; c.__exit__(None,None,None)"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Upgrade npm resolver
        run: npm install --global npm@11.21.3
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck BFF and React
        run: npm run typecheck
      - name: Test frontend and BFF
        run: npm run test
      - name: Build frontend and BFF
        run: npm run build
      - name: Build BFF production Docker image
        run: docker build -f bff/Dockerfile -t sentinela-web:ci .
      - name: Build standalone React production Nginx image
        run: docker build -f web/Dockerfile.production -t sentinela-react:ci .
      - name: Validate production Traefik and Cloudflare Tunnel Compose
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          POSTGRES_PASSWORD=disposable-ci-postgres-password-123456789
          DOMAIN_NAME=sentinela.example.com
          PROXY_NETWORK=celo-network
          TRAEFIK_ENTRYPOINT=web
          EOF
          docker compose -f compose.yaml -f compose.production.yaml --profile web config --format json > /tmp/sentinela-production-compose.json
          python3 scripts/check_production_compose.py /tmp/sentinela-production-compose.json CI
          # O manifesto nao deve publicar portas frontend/BFF no host nem criar um novo edge.
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/sentinela-production-compose.json'))
          assert 'traefik' not in c['services'] and 'cloudflared' not in c['services']
          assert not c['services']['web'].get('ports')
          assert not c['services']['bff'].get('ports')
          assert c['services']['web']['networks'].keys() == {'proxy'}
          PY
