name: One-off Poetry lock generation

on:
  push:
    branches: [feat/evolution-unicode-optin-lock]

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - name: Install Poetry 2.2.1
        run: python -m pip install poetry==2.2.1
      - name: Resolve and validate exact dependencies
        run: |
          python --version
          poetry --version
          poetry lock
          poetry check --lock
      - name: Commit resolved lock to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          if git diff --cached --quiet; then
            echo "Lock unchanged"
          else
            git commit -m "build: version Poetry 2.2.1 dependency lock"
            git push origin HEAD:feat/evolution-unicode-optin-lock
          fi
      - name: Verify production image uses resolved lock
        run: docker build --pull --tag sentinela:lock-check .
