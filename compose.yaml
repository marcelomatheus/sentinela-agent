services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sentinela}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment: &app_env
      POSTGRES_HOST: db
      AGNO_TELEMETRY: 'false'
      WEB_MEDIA_DIR: /data/web
    depends_on:
      db: {condition: service_healthy}
    networks:
      default: {}
      whatsapp_internal:
        aliases:
          - sentinela-api
    volumes:
      - web_media:/data/web
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:8080'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    build: .
    command: [python, -m, sentinela.interfaces.worker]
    env_file: .env
    environment: *app_env
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 180s
    # Worker also sends media, messages and presence to the Evolution API.
    # It must resolve the Evolution container on the same shared network.
    networks:
      - default
      - whatsapp_internal
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web_worker:
    profiles: [web]
    build: .
    command: [python, -m, sentinela.interfaces.web_worker]
    env_file: .env
    environment: *app_env
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - web_media:/data/web
    networks: [default]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  bff:
    profiles: [web]
    build:
      context: .
      dockerfile: bff/Dockerfile
    env_file: .env
    environment:
      SENTINELA_INTERNAL_URL: http://api:8080
      WEB_DIST: /app/web-dist
    depends_on:
      api: {condition: service_healthy}
    ports:
      - '127.0.0.1:${BFF_PORT:-3005}:3005'
    networks: [default]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  pgdata:
  web_media:

networks:
  default: {}
  whatsapp_internal:
    name: whatsapp_internal
    external: true
